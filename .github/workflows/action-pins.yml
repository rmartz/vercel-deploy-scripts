name: Action Pins

# Only runs when a workflow file changes — the only thing that can affect the
# pinning check. Keeps the ratchet cheap for unrelated PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/check-action-pins.sh
