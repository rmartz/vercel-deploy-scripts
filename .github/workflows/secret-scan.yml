name: Secret Scan
on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to a custom gitleaks config file"
        required: false
        type: string
        default: ""
      install-deps:
        description: "Run pnpm install before scanning (required when gitleaks config extends a file inside node_modules/)"
        required: false
        type: boolean
        default: false
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - if: ${{ inputs.install-deps }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - if: ${{ inputs.install-deps }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - if: ${{ inputs.install-deps }}
        run: pnpm install --frozen-lockfile
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ inputs.config-path }}
