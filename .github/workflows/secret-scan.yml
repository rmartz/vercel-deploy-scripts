name: Secret Scan
on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to a custom gitleaks config file"
        required: false
        type: string
        default: ""
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ inputs.config-path }}
