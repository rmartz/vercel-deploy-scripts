name: Secret Scan
on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to a custom gitleaks config file"
        required: false
        type: string
        default: ""
      install-deps:
        description: "Run pnpm install before scanning (required when gitleaks config extends a file inside node_modules/)"
        required: false
        type: boolean
        default: false
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: ${{ inputs.install-deps }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - if: ${{ inputs.install-deps }}
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
      - if: ${{ inputs.install-deps }}
        run: pnpm install --frozen-lockfile
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ inputs.config-path }}
